<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TourHunts — Offline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d1a;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
.card{max-width:380px;background:#1a1d2e;border-radius:24px;padding:40px 28px;border:1px solid rgba(255,255,255,0.08)}
.icon{font-size:56px;margin-bottom:16px;line-height:1}
h1{font-size:24px;margin:0 0 8px;font-weight:700}
p{font-size:15px;color:rgba(255,255,255,0.6);margin:0 0 24px;line-height:1.6}
.btn{display:inline-block;padding:14px 28px;background:#ff6a13;color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;transition:background 0.2s}
.btn:hover,.btn:focus{background:#ff8a3d;outline:none}
.hint{font-size:13px;color:rgba(255,255,255,0.4);margin-top:20px;line-height:1.5}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#ef4444}
.dot.online{background:#22c55e}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">No connection</span></div>
  <h1>You're offline</h1>
  <p>Check your internet connection. If you've started a hunt, you can still navigate using cached GPS data.</p>
  <a href="/" class="btn">Back to Home</a>
  <div class="hint">Tip: Add TourHunts to your home screen for the best offline experience.</div>
</div>
<script>
function updateStatus(){
  var dot=document.getElementById('statusDot');
  var text=document.getElementById('statusText');
  if(navigator.onLine){
    dot.classList.add('online');
    text.textContent='Back online';
    setTimeout(function(){window.location.href='/'},1500);
  }else{
    dot.classList.remove('online');
    text.textContent='No connection';
  }
}
window.addEventListener('online',updateStatus);
window.addEventListener('offline',updateStatus);
updateStatus();
</script>
</body>
</html>
